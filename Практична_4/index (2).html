<!doctype html>
<html lang="uk">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя сторінка — Омелич Кирило</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eaf2ff, #f7f9fc);
    }
    main {
      width: min(90%, 620px);
      padding: 42px 28px;
      box-sizing: border-box;

      background: white;
      border-radius: 18px;
      box-shadow: 0 16px 45px rgba(25, 45, 80, 0.12);
    }
    h1 { margin: 0 0 14px; font-size: clamp(1.7rem, 5vw, 2.5rem); }
    p { margin: 0; font-size: 1.15rem; color: #4b5870; }
    .label { margin-bottom: 10px; color: #526fba; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="label">Моя сторінка</p>
    <h1>Омелич Кирило</h1>
    <p>Група 121-23-2</p>
  </main>

</html>
